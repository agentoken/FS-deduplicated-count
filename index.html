<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>去重计数</title>
    <script>
      // 移动端飞书暂不支持仪表盘插件，重定向到官方提示页
      function isMobileLark() {
        const ua = window.navigator.userAgent;
        const isLark = /feishu/i.test(ua) || /lark/i.test(ua);
        const isMobile = /mobile|android|iphone|ipad|phone/i.test(ua);
        return isLark && isMobile;
      }
      if (isMobileLark()) {
        window.location.href =
          "https://ext.baseopendev.com/ext/dashboard_mobile_disable/14c264309a784b577484d14f227664050a115ed7/index.html";
        document.head.insertAdjacentHTML(
          "beforeend",
          `<meta http-equiv="Content-Security-Policy" content="script-src 'none'">`
        );
      }
    </script>
    <script type="module" crossorigin src="./assets/index-UGd3l5Zs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BlfMeKOh.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
